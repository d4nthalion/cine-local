# Atajos añadidos por CineLocal (se suman a los de mpv). Clic y rueda los gestiona scripts/cinelocal-osc.lua
mbtn_right  script-binding uosc/menu
tab         script-binding cinelocal_osc/toggle
# s: «Saltar intro / resumen» o «Siguiente episodio» si el botón está a la vista; si no, la captura de pantalla de mpv
s           script-binding cinelocal_osc/skip

# Menú de uosc (clic derecho). Las líneas "#" son comentarios para mpv; uosc lee el título tras "#!"
#           script-binding uosc/subtitles               #! Subtítulos
#           script-binding uosc/audio                   #! Pistas de audio
#           script-binding uosc/chapters                #! Capítulos
#           script-binding uosc/playlist                #! Episodios
#           script-binding uosc/editions                #! Ediciones
#           cycle-values speed 1 1.25 1.5 2 0.75        #! Velocidad > Cambiar (1× · 1,25× · 1,5× · 2× · 0,75×)
#           set speed 1                                 #! Velocidad > Normal
#           quit                                        #! Volver a CineLocal
