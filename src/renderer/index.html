<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https://image.tmdb.org; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>CineLocal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand" data-nav="home">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
        <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bg)"/>
        <path d="M12.5 9.5v13l10-6.5z" fill="#fff"/>
      </svg>
      <span>Cine<b>Local</b></span>
    </div>
    <nav class="nav" id="nav">
      <a data-nav="home">Inicio</a>
      <a data-nav="series">Series</a>
      <a data-nav="movies">Películas</a>
      <a data-nav="sagas">Sagas</a>
      <a data-nav="list">Listas</a>
      <a data-nav="requests" id="navRequests" class="hidden">Peticiones<span class="nav-badge hidden" id="reqBadge"></span></a>
      <a data-nav="access" id="navAccess" class="hidden">Registro</a>
      <a data-nav="downloads" id="navDownloads" class="hidden">Descargas<span class="nav-badge hidden" id="dlBadge"></span></a>
    </nav>
    <div class="top-actions">
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.06l4.24 4.24-1.4 1.4-4.24-4.24A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input id="searchInput" type="search" placeholder="Títulos, géneros, reparto…" spellcheck="false">
      </div>
      <div class="notif-wrap">
        <button class="icon-btn" id="btnNotif" title="Notificaciones">
          <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
          <span class="notif-dot hidden" id="notifDot"></span>
        </button>
        <div class="notif-panel hidden" id="notifPanel"></div>
      </div>
      <button class="icon-btn" data-nav="settings" title="Ajustes">
        <svg viewBox="0 0 24 24"><path d="M13.8 2l.5 2.6c.6.2 1.1.5 1.6.9l2.5-.9 1.8 3.1-2 1.7a6.9 6.9 0 0 1 0 1.8l2 1.7-1.8 3.1-2.5-.9c-.5.4-1 .7-1.6.9l-.5 2.6h-3.6l-.5-2.6c-.6-.2-1.1-.5-1.6-.9l-2.5.9-1.8-3.1 2-1.7a6.9 6.9 0 0 1 0-1.8l-2-1.7 1.8-3.1 2.5.9c.5-.4 1-.7 1.6-.9l.5-2.6zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill-rule="evenodd"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <div id="metaStatus" class="meta-status hidden"></div>
  <div id="toasts" class="toasts"></div>
  <div id="modalRoot"></div>
  <div id="loginRoot" class="login-screen hidden"></div>

  <script src="app.js"></script>
</body>
</html>
