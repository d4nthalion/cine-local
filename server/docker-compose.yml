# CineLocal Server en el NAS. Los valores entre ${…} van en server/.env (ver .env.example).
services:
  cinelocal:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: cinelocal-server
    container_name: cinelocal
    restart: unless-stopped
    # red del propio NAS: así llega a DSM en 127.0.0.1:5000 para comprobar los usuarios
    network_mode: host
    user: "${PUID}:${PGID}"
    group_add:
      - "${VIDEO_GID}"          # grupo dueño de /dev/dri/renderD128 (gráfica Intel)
      - "${SHARE_GID}"          # grupo con permiso en las carpetas compartidas (las ACL de DSM no miran los permisos Unix)
    devices:
      - /dev/dri:/dev/dri
    environment:
      HOST: "${BIND_HOST:-0.0.0.0}"   # 127.0.0.1 si sólo se entra por el proxy inverso de DSM
      PORT: "8095"
      DSM_URL: "http://127.0.0.1:5000"
      CINELOCAL_ADMINS: "${ADMINS}"
      CINELOCAL_USERS: "${USERS:-}"
      # grupos de DSM que dan acceso: administradores (corregir fichas, peticiones, ajustes) y usuarios
      # la copia de /etc/group que deja cada minuto la tarea programada de DSM (DSM sustituye el archivo al cambiar
      # un grupo, y un archivo montado suelto se quedaría con la versión vieja); si aún no existe, el montado
      CINELOCAL_GROUP_FILE: "/data/group,/host/group"
      CINELOCAL_ADMIN_GROUP: "${ADMIN_GROUP:-cinelocal-admin}"
      CINELOCAL_USER_GROUP: "${USER_GROUP:-cinelocal-user}"
      CINELOCAL_HWACCEL: "vaapi"
      TRUST_PROXY: "1"
      # aMule (el servicio «amule» de abajo): su API en el propio NAS y la carpeta donde deja lo terminado
      AMULE_URL: "http://127.0.0.1:4711"
      AMULE_PASSWORD: "${AMULE_PASSWORD:-}"
      AMULE_INCOMING: "/media/@amule/incoming"
    volumes:
      - "${MEDIA_DIR}:/media"         # la carpeta de vídeo (con escritura: ahí se colocan las descargas de aMule)
      - ./data:/data                  # ajustes, metadatos, sesiones y progreso
      - /etc/group:/host/group:ro     # grupos del NAS: quién es administrador o usuario de CineLocal
    # contenedor sin privilegios: sistema de archivos de sólo lectura, sin capacidades extra
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # aMule en el NAS: descarga en ${MEDIA_DIR}/@amule (el escáner se salta las carpetas que empiezan por @) y, al estar en
  # la misma carpeta compartida que la biblioteca, CineLocal mueve lo terminado al momento, sin copiarlo.
  amule:
    image: ngosang/amule:3.2.0-1
    container_name: amule
    restart: unless-stopped
    # red del propio NAS: los puertos P2P (4662 TCP, 4665 y 4672 UDP) quedan abiertos tal cual para el router, y
    # CineLocal llega a su API en 127.0.0.1:4711
    network_mode: host
    environment:
      PUID: "${PUID}"
      PGID: "${SHARE_GID}"      # el grupo con permiso en la carpeta compartida (las ACL de DSM no miran los permisos Unix)
      UMASK: "0002"
      TZ: "Europe/Madrid"
      WEBUI_PWD: "${AMULE_PASSWORD}"
      FIX_PERMISSIONS: "false"
    volumes:
      - "${AMULE_CONFIG:-/volume1/docker/amule/config}:/home/amule/.aMule"
      - "${MEDIA_DIR}/@amule:/downloads"
