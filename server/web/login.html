<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineLocal · Iniciar sesión</title>
  <link rel="icon" href="/web/icon.svg">
  <style>
    :root { --bg: #08080c; --bg-2: #101018; --line: rgba(255,255,255,.1); --text: #f4f4f7; --text-3: #7a7a8c; --accent: #a855f7; --grad: linear-gradient(135deg, #8b5cf6, #ec4899); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 30% 0%, rgba(139,92,246,.18), transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(236,72,153,.12), transparent 60%), var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    form { width: 100%; max-width: 380px; background: rgba(16,16,24,.85); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.45); backdrop-filter: blur(8px); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .brand svg { width: 34px; height: 34px; }
    .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.sub { margin: 0 0 24px; color: var(--text-3); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--text-3); margin: 14px 0 6px; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0c0c13; color: var(--text); font: inherit; outline: none; transition: border-color .15s; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 10px; background: var(--grad); color: #fff; font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: rgba(239,68,68,.12); color: #fca5a5; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form id="f" autocomplete="on">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#g)"/><path d="M12.5 9.5v13l10-6.5z" fill="#fff"/></svg>
      <span>Cine<b>Local</b></span>
    </div>
    <p class="sub">Entra con tu usuario del NAS</p>
    <label for="user">Usuario</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div id="otpBox" class="hidden">
      <label for="otp">Código de verificación en dos pasos</label>
      <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
    </div>
    <button id="go" type="submit">Entrar</button>
    <div id="err" class="err hidden" role="alert"></div>
  </form>
  <script src="/web/login.js"></script>
</body>
</html>
